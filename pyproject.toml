[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agro-data-audit"
version = "0.2.3"
description = "Agricultural data auditing, cleaning, XAI, and profiling framework"
authors = [
    {name="Md. Noman"}
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.20.0",
    "scikit-learn>=1.0.0",
    "shap>=0.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]
profile = [
    "ydata-profiling"
]

[project.urls]
"Homepage" = "https://github.com/md-noman-research/agro-data-audit"
"Source Code" = "https://github.com/md-noman-research/agro-data-audit"
"Bug Tracker" = "https://github.com/md-noman-research/agro-data-audit/issues"